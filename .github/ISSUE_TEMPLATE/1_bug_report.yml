name: Bug report
description: Report errors or unexpected behavior
labels:
  - bug
body:
  - type: checkboxes
    attributes:
      label: Self Checks
      options:
        - label: I have searched [existing issues](https://github.com/Junjak-Personal/crowfoot/issues), including closed ones.
          required: true
        - label: This is not a security vulnerability. (Those go to the address in [SECURITY.md](https://github.com/Junjak-Personal/crowfoot/blob/master/SECURITY.md), not here.)
          required: true

  - type: input
    attributes:
      label: crowfoot version
      description: Output of `npx crowfoot --version`, or the version shown in the viewer's Help menu.
    validations:
      required: true

  - type: dropdown
    attributes:
      label: Where did it happen?
      multiple: false
      options:
        - The CLI (erd build / erd from-link / init)
        - The generated viewer (in a browser)
        - Both
    validations:
      required: true

  - type: input
    attributes:
      label: Schema format
      description: The `--format` you used — postgres, schemarb, prisma, drizzle, tbls or liam.
    validations:
      required: false

  - type: textarea
    attributes:
      label: Steps to reproduce
      description: The exact steps that lead to the bug.
      placeholder: |
        1. Run '...'
        2. Open '...'
        3. Click on '...'
        4. See error
    validations:
      required: true

  - type: textarea
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: false

  - type: textarea
    attributes:
      label: Actual Behavior
      description: What actually happened.
    validations:
      required: false

  - type: textarea
    attributes:
      label: Additional Context
      description: Anything else that helps — logs, screenshots, a minimal schema that triggers it.
    validations:
      required: false
