name: release-crowfoot

# Publishing is gated on a tag rather than on a push to master: the tag is both
# the release record and the deliberate act, so merging a version bump never
# ships anything on its own.
on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a half-finished publish.
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # write, not read, only so the last step can create the GitHub Release.
      # Nothing here pushes commits or tags.
      contents: write
      # The whole authentication story. npm exchanges this workflow's OIDC
      # identity for a short-lived publish token (trusted publishing) and signs
      # the provenance statement with it. There is no npm token anywhere.
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/pnpm-setup

      # Node 22.21 ships npm 10.9, which predates trusted publishing and would
      # fall back to looking for a token. 11.5.1 is the first version that
      # performs the OIDC exchange.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@^11.5.1

      # A tag that disagrees with package.json means someone tagged without
      # bumping (or bumped without tagging). Fail here, before the registry
      # sees anything — a wrong version cannot be unpublished cleanly.
      - name: Verify tag matches crowfoot version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./frontend/packages/cli/package.json').version")"
          if [ "$TAG" != "v${version}" ]; then
            echo "Tag ${TAG} does not match crowfoot version ${version}." >&2
            exit 1
          fi
          echo "Releasing crowfoot ${version}."

      - run: pnpm lint

      - run: pnpm --filter @crowfoot/erd-core test

      - run: pnpm --filter crowfoot test

      # --force is not belt-and-braces here. turbo does not hash erd-core's
      # sources into crowfoot's cache key — erd-core is consumed as TypeScript
      # source, not as a built artifact — so an erd-core-only change can
      # restore a stale crowfoot bundle from cache and publish the old code.
      - run: pnpm exec turbo build --filter=crowfoot --force

      # `erd build` copies dist-cli/html verbatim into the user's output, which
      # then gets served as a site. Apache-2.0 §4(a)/§4(d) attach to that
      # distribution too, and minification has already stripped the per-file
      # §4(b) notices from the bundle — so if these two are missing, the
      # generated site carries no attribution at all. Cheap to check, silent
      # when it breaks.
      - name: Verify the generated site will carry its attribution
        run: |
          for f in LICENSE NOTICE; do
            path="frontend/packages/cli/dist-cli/html/$f"
            test -s "$path" || { echo "::error::$path is missing or empty — erd build output would ship without attribution"; exit 1; }
          done

      # No --provenance flag: trusted publishing generates the attestation on
      # its own, and no token env either — a token would take precedence over
      # the OIDC exchange. A classic Publish token got us EOTP here, because
      # the account has 2FA on write actions and CI has no authenticator.
      - name: Publish to npm
        working-directory: frontend/packages/cli
        run: npm publish --access public

      # After the publish, never before: a GitHub Release announcing a version
      # that failed to reach npm is worse than no release at all.
      #
      # The notes are the matching CHANGELOG.md section, so there is exactly one
      # place to write them. A missing section is not fatal — the release still
      # gets created, pointing at the changelog — because the package is already
      # public by this point and failing here would only leave the two out of sync.
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          notes=$(awk -v v="$version" '
            $0 == "## " v { grab = 1; next }
            grab && /^## / { exit }
            grab { print }
          ' CHANGELOG.md)
          if [ -z "$(printf '%s' "$notes" | tr -d '[:space:]')" ]; then
            echo "::warning::no CHANGELOG.md section for $version"
            notes="See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/master/CHANGELOG.md)."
          fi
          printf '%s\n\n---\n\n`npm i -g crowfoot@%s` · [demo](https://crowfoot.jun-devlog.win)\n' \
            "$notes" "$version" > /tmp/notes.md
          gh release create "$TAG" --title "$TAG" --notes-file /tmp/notes.md --verify-tag
