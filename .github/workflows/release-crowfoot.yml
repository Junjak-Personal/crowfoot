name: release-crowfoot

# Publishing is gated on a tag rather than on a push to master: the tag is both
# the release record and the deliberate act, so merging a version bump never
# ships anything on its own.
on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a half-finished publish.
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # The whole authentication story. npm exchanges this workflow's OIDC
      # identity for a short-lived publish token (trusted publishing) and signs
      # the provenance statement with it. There is no npm token anywhere.
      id-token: write

    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/pnpm-setup

      # Node 22.21 ships npm 10.9, which predates trusted publishing and would
      # fall back to looking for a token. 11.5.1 is the first version that
      # performs the OIDC exchange.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@^11.5.1

      # A tag that disagrees with package.json means someone tagged without
      # bumping (or bumped without tagging). Fail here, before the registry
      # sees anything — a wrong version cannot be unpublished cleanly.
      - name: Verify tag matches crowfoot version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./frontend/packages/cli/package.json').version")"
          if [ "$TAG" != "v${version}" ]; then
            echo "Tag ${TAG} does not match crowfoot version ${version}." >&2
            exit 1
          fi
          echo "Releasing crowfoot ${version}."

      - run: pnpm lint

      - run: pnpm --filter @liam-hq/erd-core test

      - run: pnpm --filter crowfoot test

      # --force is not belt-and-braces here. turbo does not hash erd-core's
      # sources into crowfoot's cache key — erd-core is consumed as TypeScript
      # source, not as a built artifact — so an erd-core-only change can
      # restore a stale crowfoot bundle from cache and publish the old code.
      - run: pnpm exec turbo build --filter=crowfoot --force

      # No --provenance flag: trusted publishing generates the attestation on
      # its own, and no token env either — a token would take precedence over
      # the OIDC exchange. A classic Publish token got us EOTP here, because
      # the account has 2FA on write actions and CI has no authenticator.
      - name: Publish to npm
        working-directory: frontend/packages/cli
        run: npm publish --access public
